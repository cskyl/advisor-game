---
# ============================================================================
#  Advisor Simulator — English strings. {{var}} interpolates a game variable;
#  **bold** / *italic* markdown works.
# ============================================================================
ui.ok: Ok.
ui.lab: "Lab:"
ui.status: "Status:"
ui.helpButton: Help
ui.helpTitle: Help
ui.helpContent: "You're a brand-new AI assistant professor. Your **lab produces research every month** (faster with more students, better GPUs, higher morale, more talent), which banks into **drafts**. Major **conference deadlines** are months apart — ICML, NeurIPS, AAAI, CVPR — and at each one you submit *all* your ready drafts to that venue at once, so a bigger lab can land several papers in one deadline. Top venues are harder to crack but worth more reputation. Each **month** you pick one focus; each **year** you decide whether to recruit. Watch three meters: **Morale** (0 = the lab implodes), **Funding** (stipends + GPUs drain it monthly; 0 = bankrupt), and **Reputation** (drives acceptance and attracts strong students). At the **tenure review in Year 7**, a few solid papers earns tenure — **{{rule.papersForTenure}} papers and reputation ≥ 50** earns the *dream* ending."
ui.aboutButton: About
ui.aboutTitle: About
ui.aboutContent: "**Advisor Simulator** — you run an AI lab and chase tenure while keeping your students sane. A reskin of **PhD Simulator** by Mianzhi Wang (MIT). The game is pure data; edit the YAML in `static/rulesets/advisor` to mod it."

# Meters
ui.moraleMeter: "❤ Morale {{lab.morale}}/100"
ui.fundingMeter: "$ Funding {{pi.funding}} (−{{hud.monthlyBurn}}/mo, ~{{hud.runway}}mo left)"
ui.labMeter: "👥 {{lab.students}} · GPU {{lab.compute}}"
ui.researchMeter: "📄 {{hud.draftsBanked}} draft(s) ready · {{lab.progress}}/100 next"
ui.reputationMeter: "★ Rep {{pi.reputation}} · Papers {{pi.papers}}/{{rule.papersForTenure}}"
ui.timeMeter: "Year {{year}} Month {{month}}"

# Items (shown in the Lab panel)
item.starStudent: Star Student
item.starStudent.description: A standout PhD you managed to recruit. Lifts the lab's average talent.
item.bestPaperAward: Best Paper Award
item.bestPaperAward.description: A spotlight/oral that turned heads. Pure prestige.

# Statuses
status.newFaculty: New Faculty
status.newFaculty.description: First-year honeymoon — the baseline morale drain is waived.
status.deadlineCrunch: Deadline Crunch
status.deadlineCrunch.description: A conference deadline looms. Pushing pays off more, but morale burns faster.
status.strongRebuttal: Polished Submissions
status.strongRebuttal.description: Extra-careful writing and rebuttals. Acceptance odds are temporarily higher.
status.tenureClock: Tenure Clock
status.tenureClock.description: The packet is due. A low, constant hum of pressure on the whole lab.

# Generic confirm buttons
msg.ok: Ok.
msg.letsGo: Let's go.
msg.great: Great!
msg.sigh: "*sigh*"
msg.gulp: "...gulp."
msg.argh: Argh!
msg.fingersCrossed: Fingers crossed...
msg.restart: Start a new timeline.

# Opening
msg.beginning: "Congratulations — you've accepted an offer as an **Assistant Professor of Computer Science**. You have startup funds, two eager PhD students, and six years until your tenure case. Do you take the job?"
msg.acceptJob: Accept the offer and move into my new office.
msg.acceptedJob: "You hang your diploma, set up a coffee machine, and meet your two students. The clock starts now."
msg.declineJob: Decline — take the $600k industry research scientist offer instead.
msg.declinedJob: "You join a big AI lab, ship models used by millions, and sleep eight hours a night. Was it the right call? You'll never know. **(You win, sort of.)**"

# Conference openings (one per deadline month)
msg.confICML: "📣 **ICML deadline this month.** A top-tier venue — hard to get into, but a real prize. Submit everything that's ready."
msg.confNeurIPS: "📣 **NeurIPS deadline this month.** The big one. Brutal reviews, enormous prestige. The whole field is sprinting."
msg.confAAAI: "📣 **AAAI deadline this month.** A solid, broad venue with friendlier odds. A dependable target for the whole pipeline."
msg.confCVPR: "📣 **CVPR deadline this month.** The vision flagship — fiercely competitive, hugely prestigious."

# Tenure clock
msg.tenureClockStarts: "Year 4. The department chair 'gently reminds' you that your tenure packet is due in three years. The clock is now very loud."

# Monthly action
msg.chooseAction: "A new month. The lab is already grinding — where do *you* put your attention?"
msg.actCrunch: "🔬 Crunch with the lab toward the deadline."
msg.actCrunchDone: "Whiteboards fill, jobs launch, Slack never sleeps. Progress jumps — and so does the exhaustion."
msg.actMentor: "🤝 Hold real 1:1s and check on everyone."
msg.actMentorDone: "You actually listen. Shoulders unclench across the lab, and people sharpen a little."
msg.actGrant: "📝 Lock yourself away and write a grant."
msg.actGrantWin: "The panel loved it — the award lands. Stipends are safe for a good while."
msg.actGrantFail: "Triaged. 'Strong proposal, but not competitive this cycle.' A month gone."
msg.actNetwork: "🎤 Give talks and work the hallway track."
msg.actNetworkDone: "Handshakes, a podcast invite, two new collaborators. Your name travels."
msg.actNetworkGift: "Over coffee, an industry friend offers an **unrestricted gift** to your lab. Yes please."
msg.actRest: "🌿 Protect work-life balance this month."
msg.actRestDone: "No weekend emails. The lab recharges; you fall a touch behind the hype cycle, and that's fine."
msg.actCompute: "💻 Upgrade the GPU cluster (cost {{hud.gpuCost}} funding)."
msg.actComputeDone: "New nodes spin up. Bigger batches, faster iteration — and a very happy lab."
msg.actPolish: "✍️ Drill on writing, framing, and rebuttals."
msg.actPolishDone: "The next couple of submissions will be tighter and harder to dismiss."

# Submission round (batch)
msg.confSubmitting: "Submissions fly out the door minutes before the deadline. Now you wait for the reviewers."
msg.confResults: "**The reviews are in.** Accepted: **{{tmp.acc}}** · Rejected: **{{tmp.rej}}**. Champagne for some, a Reviewer 2 special for others — rejected work survives for the next deadline."
msg.confNothingReady: "Nothing was ready in time for this deadline. The drafts will have to wait for the next venue."

# Recruiting
msg.recruitChoose: "Recruiting season. Bring someone on? **You can hire as many as you can afford** — you'll be asked again after each. *(Each student adds {{rule.stipend}}/month to your stipend bill; you're at −{{hud.monthlyBurn}}/mo with ~{{hud.runway}} months of funding.)*"
msg.recruitStrong: "Recruit a standout PhD (−8 funding; needs reputation; brings talent)."
msg.recruitStrongDone: "A coveted admit picks *your* lab over the offers. The whole group levels up."
msg.recruitRegular: "Recruit a solid, regular PhD student (−5 funding)."
msg.recruitRegularDone: "A capable new student joins. Onboarding takes a bit, and the stipend bill grows."
msg.recruitPostdoc: "Hire a postdoc (−22 funding; expensive, immediately productive)."
msg.recruitPostdocDone: "An experienced postdoc arrives and hits the ground running — at a real cost to the budget."
msg.recruitNone: "That's enough hiring for this year."
msg.recruitNoneDone: "You keep the lab at a size you can actually fund. Sometimes that's the wise move."

# Student leaves
msg.studentQuits: "Morale has been underwater too long. A student quietly transfers to another lab. The room feels emptier."

# Event: Reviewer 2
msg.evReviewer2: "Early reviews leak in and Reviewer 2 is *spicy*. Fight or fold?"
msg.evReviewer2Fight: "Write a surgical, receipts-filled rebuttal."
msg.evReviewer2FightDone: "Twelve hours and a wall of citations later, the rebuttal is a thing of beauty. Acceptance odds tick up — at a cost to everyone's weekend."
msg.evReviewer2Concede: "Pull back and strengthen the work instead."
msg.evReviewer2ConcedeDone: "You take the notes seriously and lose a little progress — but the next version will be harder to dismiss."

# Event: industry offer
msg.evOffer: "Your strongest student just got a **$500k offer from a frontier lab**. They look to you for a reaction."
msg.evOfferBless: "Tell them it's a fantastic opportunity — go."
msg.evOfferBlessDone: "They leave grateful and stay an evangelist for your lab. You lose a contributor, but the goodwill is real."
msg.evOfferGuilt: "Remind them how close the thesis is... and how much you've invested."
msg.evOfferGuiltDone: "They stay, and the work moves — but something shifts in the room, and it isn't good."

# Event: cluster outage / windfall
msg.evOutage: "The GPU cluster goes down 72 hours before the deadline. Jobs evaporate."
msg.evWindfall: "An unexpected industry gift / supplemental award lands in your account."

# Endings
msg.labImplodes: "**Game over.** Morale hit zero. Students transfer out, an anonymous letter circulates, and your lab quietly dissolves. The papers were never worth this."
msg.bankrupt: "**Game over.** The funding ran dry. You can't make payroll; students scatter to other labs. You can't run a lab on fumes."
msg.labEmpty: "**Game over.** The last student left. An advisor with no lab is just a person with a very quiet office and a tenure clock."
msg.tenureGranted: "**TENURE GRANTED.** Strong papers, healthy lab, a name people know. You made it — and your students still talk to you. *The dream ending.*"
msg.tenureBorderline: "**Tenure granted — barely.** The committee squinted at your reputation but the paper count carried you. You're in. Breathe."
msg.tenureDenied: "**Tenure denied.** Not enough top-tier output, the committee says. You take the $700k industry offer you should've taken six years ago. **The real ending.**"
