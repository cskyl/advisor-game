---
# ============================================================================
#  导师模拟器 / Advisor Simulator — event ruleset (v2: lab + recruiting + budget)
#
#  You are a new AI assistant professor. Run a lab, chase tenure (Year 7),
#  and don't burn anyone out. Key systems:
#   - LAB PRODUCES PAPERS AUTOMATICALLY each month, scaling with #students,
#     GPU tier (compute), morale, and avg talent. More/better students = faster.
#   - Each YEAR you decide whether to RECRUIT (strong PhD / regular PhD / postdoc
#     / none) — gated by reputation and funding.
#   - FUNDING is a budget you allocate: stipends drain it monthly (per student),
#     and you can spend it on GPUs or a postdoc. Run out -> bankrupt.
#   - Each MONTH you pick ONE focus that shapes the lab on top of its baseline.
#
#  Events under the same trigger run in DEFINITION ORDER below, so ordering is
#  intentional: upkeep -> lose-checks -> action -> production -> paper verdict
#  -> random cards.
#
#  Engine actions: UpdateVariables, UpdateVariableLimits, SetStatus, GiveItem,
#  DisplayMessage, DisplayChoices (choices take an optional `requirement` expr),
#  Random (groups+weight), Switch (every branch needs a condition), EndGame.
#  Functions: randi(n), floor, round, ceil, min, max, clip(x,lo,hi),
#  hasStatus('id'), getAttributeValue('id'). Booleans act as 1/0 in arithmetic.
# ============================================================================

# --- Boot -------------------------------------------------------------------
- id: Init
  trigger: Initialization
  once: true
  actions:
  - id: UpdateVariableLimits
    updates:
      lab.morale: [0, 100]
      pi.reputation: [0, 100]
      lab.compute: [0, 5]
      lab.students: [0, 12]
      pi.funding: [0, 9999]
  - id: UpdateVariables
    updates:
      elapsedMonth: 0
      month: 1
      year: 1
      lab.morale: 78            # ❤️ 0 -> lab implodes
      pi.funding: 75            # 💰 stipends + GPUs drain this monthly
      pi.reputation: 20         # 📈 drives acceptance + attracts strong students
      lab.students: 2           # 👥 you start with two PhD students
      lab.compute: 0            # GPU tier 0..5; boosts production + acceptance
      lab.talent: 1.0           # average student quality multiplier
      pi.papers: 0
      lab.progress: 0           # banked research; every 100 = one ready draft
      lab.draftsReady: 0        # drafts waiting for the next conference deadline
      conf.accMod: 0            # current venue's acceptance modifier
      conf.prestige: 1          # current venue's reputation multiplier
      tmp.acc: 0                # scratch: papers accepted this round
      tmp.rej: 0                # scratch: papers rejected this round
      rule.papersForTenure: 12  # papers needed for the *dream* tenure ending
      rule.stipend: 2           # funding per student per month
  - id: SetStatus
    statusId: newFaculty
    on: true

# --- Master clock -----------------------------------------------------------
- id: GameTick
  trigger: Tick
  actions:
  - id: UpdateVariables
    updates:
      elapsedMonth: elapsedMonth + 1
      month: ((elapsedMonth - 1) % 12) + 1
      year: floor((elapsedMonth - 1) / 12) + 1
  - id: Switch
    branches:
    - condition: elapsedMonth % 12 === 1
      actions:
      - id: TriggerEvents
        triggers:
        - id: YearBegin
          priority: 1
  - id: TriggerEvents
    triggers:
    - id: MonthBegin

# --- Opening ----------------------------------------------------------------
- id: TheBeginning
  trigger: MonthBegin
  once: true
  actions:
  - id: DisplayChoices
    message: msg.beginning
    choices:
    - message: msg.acceptJob
      actions:
      - id: DisplayMessage
        message: msg.acceptedJob
        confirm: msg.letsGo
    - message: msg.declineJob
      actions:
      - id: EndGame
        message: msg.declinedJob
        confirm: msg.restart
        winning: true

# --- Conference opens: announce the venue, set its difficulty, set crunch mood.
#  Calendar: ICML(1) ACL(3) NeurIPS(5) AAAI(8) ICLR(9) CVPR(11). Top venues are
#  harder to get into but worth more reputation; *-mid venues are the opposite.
#  This fires BEFORE the monthly action so "Crunch" benefits from the deadline.
- id: ConferenceOpens
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: month === 1 || month === 3 || month === 5 || month === 8 || month === 9 || month === 11
  actions:
  - id: SetStatus
    statusId: deadlineCrunch
    on: true
  - id: Switch
    branches:
    - condition: month === 1     # ICML — top
      actions:
      - id: UpdateVariables
        updates: { conf.accMod: -0.04, conf.prestige: 1.3 }
      - id: DisplayMessage
        message: msg.confICML
        confirm: msg.ok
    - condition: month === 3     # ACL — mid
      actions:
      - id: UpdateVariables
        updates: { conf.accMod: 0.08, conf.prestige: 0.9 }
      - id: DisplayMessage
        message: msg.confACL
        confirm: msg.ok
    - condition: month === 5     # NeurIPS — top
      actions:
      - id: UpdateVariables
        updates: { conf.accMod: -0.04, conf.prestige: 1.3 }
      - id: DisplayMessage
        message: msg.confNeurIPS
        confirm: msg.ok
    - condition: month === 8     # AAAI — mid
      actions:
      - id: UpdateVariables
        updates: { conf.accMod: 0.08, conf.prestige: 0.9 }
      - id: DisplayMessage
        message: msg.confAAAI
        confirm: msg.ok
    - condition: month === 9     # ICLR — top
      actions:
      - id: UpdateVariables
        updates: { conf.accMod: -0.04, conf.prestige: 1.3 }
      - id: DisplayMessage
        message: msg.confICLR
        confirm: msg.ok
    - condition: 1               # CVPR (month 11) — top
      actions:
      - id: UpdateVariables
        updates: { conf.accMod: -0.04, conf.prestige: 1.3 }
      - id: DisplayMessage
        message: msg.confCVPR
        confirm: msg.ok

# --- Monthly upkeep: pay the lab, apply morale drain ------------------------
- id: MonthlyUpkeep
  trigger: MonthBegin
  actions:
  - id: UpdateVariables
    updates:
      # stipends scale with headcount; GPUs cost upkeep; +3 institutional support
      pi.funding: pi.funding - (lab.students * rule.stipend) - lab.compute + 3
      lab.morale: lab.morale - getAttributeValue('pi.moraleDrain')

# --- Lose conditions --------------------------------------------------------
- id: LabImplodes
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: lab.morale <= 0
  actions:
  - id: EndGame
    message: msg.labImplodes
    confirm: msg.restart
    winning: false
- id: Bankrupt
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: pi.funding <= 0
  actions:
  - id: EndGame
    message: msg.bankrupt
    confirm: msg.restart
    winning: false
- id: LabEmpty
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: lab.students <= 0
  actions:
  - id: EndGame
    message: msg.labEmpty
    confirm: msg.restart
    winning: false

# --- A student quits if morale stays in the gutter --------------------------
- id: StudentQuits
  trigger: MonthBegin
  probability: 0.20
  conditions:
  - id: Expression
    expression: lab.morale < 30 && lab.students >= 1
  actions:
  - id: UpdateVariables
    updates:
      lab.students: lab.students - 1
      lab.morale: lab.morale + 8   # the survivors feel the (grim) relief
  - id: DisplayMessage
    message: msg.studentQuits
    confirm: msg.sigh

# --- THE monthly decision: your one focus this month ------------------------
- id: MonthlyAction
  trigger: MonthBegin
  actions:
  - id: DisplayChoices
    message: msg.chooseAction
    choices:
    # 1) Crunch toward the deadline: big burst (bigger in deadline season).
    - message: msg.actCrunch
      actions:
      - id: UpdateVariables
        updates:
          lab.progress: lab.progress + randi(14) + 12 + hasStatus('deadlineCrunch') * 16
          lab.morale: lab.morale - (randi(6) + 6)
      - id: DisplayMessage
        message: msg.actCrunchDone
        confirm: msg.ok
    # 2) Mentor / 1:1s: morale up.
    - message: msg.actMentor
      actions:
      - id: UpdateVariables
        updates:
          lab.morale: lab.morale + (randi(8) + 8)
          lab.talent: clip(lab.talent + 0.02, 0.6, 1.8)   # people grow
      - id: DisplayMessage
        message: msg.actMentorDone
        confirm: msg.ok
    # 3) Write a grant: chance of a funding windfall.
    - message: msg.actGrant
      actions:
      - id: Random
        groups:
        - weight: 0.6
          actions:
          - id: UpdateVariables
            updates:
              # bigger reputation wins bigger grants -> growth funds itself
              pi.funding: pi.funding + (randi(25) + 30 + floor(pi.reputation / 4))
              pi.reputation: pi.reputation + 1
          - id: DisplayMessage
            message: msg.actGrantWin
            confirm: msg.great
        - weight: 0.4
          actions:
          - id: UpdateVariables
            updates:
              lab.morale: lab.morale - 2
          - id: DisplayMessage
            message: msg.actGrantFail
            confirm: msg.sigh
    # 4) Network / give talks: reputation up, small chance of an industry gift.
    - message: msg.actNetwork
      actions:
      - id: UpdateVariables
        updates:
          pi.reputation: pi.reputation + (randi(6) + 4)
      - id: Random
        groups:
        - weight: 0.25
          actions:
          - id: UpdateVariables
            updates:
              pi.funding: pi.funding + (randi(15) + 10)
          - id: DisplayMessage
            message: msg.actNetworkGift
            confirm: msg.great
        - weight: 0.75
          actions:
          - id: DisplayMessage
            message: msg.actNetworkDone
            confirm: msg.ok
    # 5) Protect work-life balance: morale up, fall a little behind.
    - message: msg.actRest
      actions:
      - id: UpdateVariables
        updates:
          lab.morale: lab.morale + (randi(7) + 6)
          pi.reputation: pi.reputation - 1
      - id: DisplayMessage
        message: msg.actRestDone
        confirm: msg.ok
    # 6) Buy GPUs (spend funding to raise compute). Only shown if affordable.
    - message: msg.actCompute
      requirement: pi.funding >= (18 + lab.compute * 9) && lab.compute < 5
      actions:
      - id: UpdateVariables
        updates:
          pi.funding: pi.funding - (18 + lab.compute * 9)
          lab.compute: lab.compute + 1
          lab.morale: lab.morale + 3   # everyone loves a bigger cluster
      - id: DisplayMessage
        message: msg.actComputeDone
        confirm: msg.great
    # 7) Polish & prep: buff acceptance odds for the next 2 months.
    - message: msg.actPolish
      actions:
      - id: SetStatus
        statusId: strongRebuttal
        on: true
      - id: UpdateVariables
        updates:
          lab.morale: lab.morale - 3
      - id: DisplayMessage
        message: msg.actPolishDone
        confirm: msg.ok

# --- Automatic research output: the lab works whether or not you do ---------
- id: ResearchProduction
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: lab.students >= 1
  actions:
  - id: UpdateVariables
    updates:
      lab.progress: lab.progress + floor(lab.students * 3 * (1 + lab.compute * 0.18) * clip(lab.morale / 60, 0.4, 1.4) * clip(lab.talent, 0.7, 1.5))

# --- Conference submission: batch-submit ALL ready drafts to this venue -------
#  Runs at deadline months, AFTER production. Banked progress is converted into
#  whole drafts (every 100), and each draft is reviewed in a loop. You can land
#  several papers (or rejections) in a single deadline.
- id: ConferenceSubmit
  trigger: MonthBegin
  conditions:
  - id: Expression
    expression: month === 1 || month === 3 || month === 5 || month === 8 || month === 9 || month === 11
  actions:
  - id: UpdateVariables
    updates:
      lab.draftsReady: floor(lab.progress / 100)
      lab.progress: lab.progress - floor(lab.progress / 100) * 100
      tmp.acc: 0
      tmp.rej: 0
  - id: Switch
    branches:
    - condition: lab.draftsReady >= 1
      actions:
      - id: DisplayMessage
        message: msg.confSubmitting
        confirm: msg.fingersCrossed
      # Review each ready draft. Acceptance uses the current venue's modifier.
      - id: Loop
        stopCondition: lab.draftsReady <= 0
        maxIterations: 30
        actions:
        - id: UpdateVariables
          updates:
            lab.draftsReady: lab.draftsReady - 1
        - id: Random
          groups:
          - weight: clip(0.45 + pi.reputation / 200 + getAttributeValue('pi.paperAcceptanceBoost') + lab.compute * 0.03 + conf.accMod, 0.1, 0.95)
            actions:   # ACCEPTED
            - id: UpdateVariables
              updates:
                pi.papers: pi.papers + 1
                pi.reputation: pi.reputation + round((randi(3) + 4) * conf.prestige)
                lab.morale: lab.morale + (randi(4) + 5)
                tmp.acc: tmp.acc + 1
          - weight: clip(0.55 - pi.reputation / 200 - getAttributeValue('pi.paperAcceptanceBoost') - lab.compute * 0.03 - conf.accMod, 0.05, 0.9)
            actions:   # REJECTED — most of the work survives for a resubmission
            - id: UpdateVariables
              updates:
                lab.morale: lab.morale - (randi(3) + 4)
                lab.progress: lab.progress + 45
                tmp.rej: tmp.rej + 1
      - id: DisplayMessage
        message: msg.confResults
        confirm: msg.ok
    - condition: 1   # nothing was ready in time
      actions:
      - id: DisplayMessage
        message: msg.confNothingReady
        confirm: msg.ok

# ============================================================================
#  YEARLY EVENTS
# ============================================================================

# --- Tenure clock starts loudly in Year 4 -----------------------------------
- id: TenureClockStarts
  trigger: YearBegin
  once: true
  conditions:
  - id: Expression
    expression: year >= 4
  actions:
  - id: DisplayMessage
    message: msg.tenureClockStarts
    confirm: msg.gulp
  - id: SetStatus
    statusId: tenureClock
    on: true

# --- Recruiting season (Years 2-6): decide whether to grow the lab ----------
- id: RecruitDecision
  trigger: YearBegin
  conditions:
  - id: Expression
    expression: year >= 2 && year <= 6
  actions:
  - id: DisplayChoices
    message: msg.recruitChoose
    choices:
    # Strong PhD: needs a reputation to attract; brings talent + a head start.
    - message: msg.recruitStrong
      requirement: pi.reputation >= 32 && pi.funding >= 8
      actions:
      - id: UpdateVariables
        updates:
          lab.students: lab.students + 1
          lab.talent: clip(lab.talent + 0.12, 0.6, 1.8)
          lab.progress: lab.progress + 12
          pi.funding: pi.funding - 8
          lab.morale: lab.morale + 3
      - id: GiveItem
        itemId: starStudent
        amount: 1
      - id: DisplayMessage
        message: msg.recruitStrongDone
        confirm: msg.great
    # Regular PhD: cheap, available to most labs; slight talent dilution + onboarding cost.
    - message: msg.recruitRegular
      requirement: pi.funding >= 5
      actions:
      - id: UpdateVariables
        updates:
          lab.students: lab.students + 1
          lab.talent: clip(lab.talent - 0.04, 0.6, 1.8)
          pi.funding: pi.funding - 5
          lab.morale: lab.morale - 2
      - id: DisplayMessage
        message: msg.recruitRegularDone
        confirm: msg.ok
    # Postdoc: expensive, immediate productivity + talent.
    - message: msg.recruitPostdoc
      requirement: pi.funding >= 22
      actions:
      - id: UpdateVariables
        updates:
          lab.students: lab.students + 1
          lab.talent: clip(lab.talent + 0.18, 0.6, 1.8)
          lab.progress: lab.progress + 28
          pi.funding: pi.funding - 22
      - id: DisplayMessage
        message: msg.recruitPostdocDone
        confirm: msg.great
    # Hold steady this year.
    - message: msg.recruitNone
      actions:
      - id: UpdateVariables
        updates:
          lab.morale: lab.morale + 2
      - id: DisplayMessage
        message: msg.recruitNoneDone
        confirm: msg.ok

# --- Tenure review: the endgame (start of Year 7) ---------------------------
- id: TenureReview
  trigger: YearBegin
  conditions:
  - id: Expression
    expression: year >= 7
  actions:
  - id: Switch
    branches:
    - condition: pi.papers >= rule.papersForTenure && pi.reputation >= 55
      actions:
      - id: EndGame
        message: msg.tenureGranted
        confirm: msg.restart
        winning: true
    - condition: pi.papers >= 6
      actions:
      - id: EndGame
        message: msg.tenureBorderline
        confirm: msg.restart
        winning: true
    - condition: 1
      actions:
      - id: EndGame
        message: msg.tenureDenied
        confirm: msg.restart
        winning: false

# ============================================================================
#  RANDOM EVENT CARDS — add freely; this is where flavor & replayability live.
# ============================================================================

# Reviewer 2 strikes a paper in progress.
- id: EvReviewer2
  trigger: MonthBegin
  probability: 0.06
  conditions:
  - id: Expression
    expression: lab.progress > 20
  actions:
  - id: DisplayChoices
    message: msg.evReviewer2
    choices:
    - message: msg.evReviewer2Fight
      actions:
      - id: SetStatus
        statusId: strongRebuttal
        on: true
      - id: UpdateVariables
        updates:
          lab.morale: lab.morale - 4
      - id: DisplayMessage
        message: msg.evReviewer2FightDone
        confirm: msg.ok
    - message: msg.evReviewer2Concede
      actions:
      - id: UpdateVariables
        updates:
          lab.progress: lab.progress - 20
      - id: DisplayMessage
        message: msg.evReviewer2ConcedeDone
        confirm: msg.ok

# A star student gets a huge industry offer.
- id: EvIndustryOffer
  trigger: MonthBegin
  probability: 0.045
  conditions:
  - id: Expression
    expression: year >= 2 && lab.students >= 2
  actions:
  - id: DisplayChoices
    message: msg.evOffer
    choices:
    - message: msg.evOfferBless
      actions:
      - id: UpdateVariables
        updates:
          lab.students: lab.students - 1
          pi.reputation: pi.reputation + 5
          lab.morale: lab.morale + 6
      - id: DisplayMessage
        message: msg.evOfferBlessDone
        confirm: msg.ok
    - message: msg.evOfferGuilt
      actions:
      - id: UpdateVariables
        updates:
          lab.progress: lab.progress + 15
          lab.morale: lab.morale - 12
      - id: DisplayMessage
        message: msg.evOfferGuiltDone
        confirm: msg.ok

# GPU cluster outage right before a deadline.
- id: EvClusterOutage
  trigger: MonthBegin
  probability: 0.05
  conditions:
  - id: Expression
    expression: lab.progress >= 35
  actions:
  - id: DisplayMessage
    message: msg.evOutage
    confirm: msg.argh
  - id: UpdateVariables
    updates:
      lab.progress: lab.progress - (randi(15) + 10)

# A surprise gift / supplemental award lands.
- id: EvWindfall
  trigger: MonthBegin
  probability: 0.04
  actions:
  - id: DisplayMessage
    message: msg.evWindfall
    confirm: msg.great
  - id: UpdateVariables
    updates:
      pi.funding: pi.funding + (randi(25) + 15)
