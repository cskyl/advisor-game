---
# Timed / permanent status effects. `duration` is in months (Infinity = forever).
# Effects apply attributeModifiers while active.
status:
# Pre-tenure honeymoon: first year cancels out the baseline morale drain.
- id: newFaculty
  duration: 12
  effects:
  - attributeModifiers:
    - target: pi.moraleDrain
      type: Absolute
      amount: -1
# A conference deadline window: encourages pushing the lab.
- id: deadlineCrunch
  duration: 2
  effects:
  - attributeModifiers:
    - target: pi.moraleDrain
      type: Absolute
      amount: 2          # crunch quietly burns morale every month
# A strong rebuttal buff: temporarily raises acceptance odds.
- id: strongRebuttal
  duration: 2
  effects:
  - attributeModifiers:
    - target: pi.paperAcceptanceBoost
      type: Absolute
      amount: 0.25
# The tenure clock starts ticking loudly in later years.
- id: tenureClock
  duration: Infinity
  effects:
  - attributeModifiers:
    - target: pi.moraleDrain
      type: Absolute
      amount: 1
