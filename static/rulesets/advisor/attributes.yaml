---
# Hidden "boost" attributes that status effects modify. Read in expressions via
# getAttributeValue('...'). Modifiers from active statuses sum onto baseValue.
attributes:
- id: pi.paperAcceptanceBoost   # added to a paper's acceptance probability
  baseValue: 0
- id: pi.moraleDrain            # morale lost each month (raised during crunch /
  baseValue: 1                  # tenure clock; offset by the newFaculty status)
